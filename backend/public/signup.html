<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Academic Certificate Verification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #3494e6, #ec6ead);
        }

        .container {
            width: 450px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 40px;
        }

        .signup-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .signup-header h2 {
            color: #333;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #3494e6, #ec6ead);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .password-requirements {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="signup-header">
            <h2>Create New Account</h2>
        </div>
        <form id="signupForm">
            <div class="form-group">
                <label for="name"> Name</label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    placeholder="Enter your full name" 
                    required
                >
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="Enter your email" 
                    required
                >
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input 
                    type="tel" 
                    id="phone" 
                    name="phone" 
                    placeholder="Enter your phone number" 
                    required
                >
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Create a strong password" 
                    required
                >
                <p class="password-requirements">
                    Password must be at least 8 characters long, contain uppercase, 
                    lowercase, number, and special character.
                </p>
            </div>
            <div class="form-group">
                <label for="role">Role</label>
                <input 
                    type="text" 
                    id="role" 
                    name="role" 
                    placeholder="Only Student or Institution" 
                    required
                >
            </div>
            
            <button type="submit" class="btn">Sign Up</button>
            <div class="login-link">
                <p>Already have an account? <a href="login.html">Login</a></p>
            </div>
        </form>
    </div>

    <script>
        // document.getElementById('signupForm').addEventListener('submit', function(e) {
        //     e.preventDefault();
            
        //     const name = document.getElementById('name').value;
        //     const email = document.getElementById('email').value;
        //     const phone = document.getElementById('phone').value;
        //     const password = document.getElementById('password').value;
        //     const role= document.getElementById('role').value;
           

        

        //     // Password strength validation
        //     const passwordRegex = /^(?=.\d)(?=.[a-z])(?=.[A-Z])(?=.[!@#$%^&*]).{8,}$/;
        //     if (!passwordRegex.test(password)) {
        //         alert('Password does not meet requirements');
        //         return;
        //     }

        //     // Implement signup logic here
        //     console.log('Signup details:', {
        //         name, 
        //         email, 
        //         phone,
        //         role
        //     });
        // });
        document.getElementById('signupForm').addEventListener('submit', function (e) {
    e.preventDefault();
    
    // Collect form data
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const phone = document.getElementById('phone').value;
    const password = document.getElementById('password').value;
    const role = document.getElementById('role').value;

    // Password strength validation
    // const passwordRegex = /^(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#$%^&*]).{8,}$/;
    // if (!passwordRegex.test(password)) {
    //     alert('Password does not meet requirements');
    //     return;
    // }
    console.log(name ,phone,password,role);
    // Ensure role is either "Student" or "Institution"
    if (role.toLowerCase() !== 'student' && role.toLowerCase() !== 'institution') {
        alert('Role must be either "Student" or "Institution"');
        return;
    }

    // Create the request payload
    const payload = {
        name,
        email,
        phone,
        password,
        role
    };

    // Send the data to the backend
    fetch('http://localhost:5000/api/auth/register', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify(payload),
    })
    .then(response => {
        if (!response.ok) {
            throw new Error('Network response was not ok');
        }
        return response.json();
    })
    .then(data => {
        if (data.success) {
            alert('Signup successful! Redirecting to login.');
            window.location.href = 'login.html';
        } else {
            alert(`Signup failed: ${data.message || 'Unknown error'}`);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('An error occurred. Please try again.');
    });
});

    </script>
</body>
</html>
